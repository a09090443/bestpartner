name: Harness Checks

# Harness 原則 3/6 的自動化把關：
#   - ArchUnit 結構不變量（分層依賴、命名、@Entity 位置）
#   - 漂移掃描（i18n 寫死字串、版本硬編碼、套件拼字、CDI 標註、NodeType 前後端契約、前端測試命名）
#   - 前端型別檢查（vue-tsc）與單元測試（vitest）
# 任一失敗即擋下，讓違規在 CI 階段就紅，而非靠人工 review 或 agent 自律。

on:
  pull_request:
    branches: [master]
  push:
    branches: ['**']
  workflow_dispatch:

# 同分支新推送時取消尚在跑的舊流程
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: ArchUnit + 漂移掃描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 機械化強制 — ArchitectureTest（ArchUnit）
        working-directory: bestpartner-service
        run: |
          chmod +x ./gradlew
          ./gradlew test --tests "tw.zipe.bastpartner.architecture.ArchitectureTest" \
            -Dorg.gradle.daemon=false --no-daemon

      - name: 漂移掃描 — harness-drift-scan（bash 原生）
        run: ./scripts/harness-drift-scan.sh

      # scripts/ 下的掃描有 .sh 與 .ps1 兩份實作（Linux/macOS 原生 vs Windows）。
      # 兩份規則或基線一旦分歧，兩邊會各說各話且無人察覺——故在此機械化比對結論。
      # 這是雙份實作的代價，不可移除；修改任一份時另一份必須同步。
      - name: 兩份實作結論一致（.sh ≡ .ps1）
        shell: bash
        run: |
          set -uo pipefail
          set +e
          sh_out="$(./scripts/harness-drift-scan.sh)"; sh_rc=$?
          ps_out="$(pwsh ./scripts/harness-drift-scan.ps1)"; ps_rc=$?
          set -e

          sh_sum="$(printf '%s' "$sh_out" | grep -oE '基線 [0-9]+ 項、新漂移 [0-9]+ 項' || true)"
          ps_sum="$(printf '%s' "$ps_out" | grep -oE '基線 [0-9]+ 項、新漂移 [0-9]+ 項' || true)"

          echo "bash : rc=$sh_rc  $sh_sum"
          echo "pwsh : rc=$ps_rc  $ps_sum"

          if [[ -z "$sh_sum" || -z "$ps_sum" ]]; then
            echo "::error::無法從掃描輸出解析結論摘要，請檢查兩份腳本的輸出格式。"
            exit 1
          fi
          if [[ "$sh_rc" != "$ps_rc" || "$sh_sum" != "$ps_sum" ]]; then
            echo "::error::harness-drift-scan 的 .sh 與 .ps1 兩份實作結論不一致——規則或基線已漂移，請同步後再推送。"
            exit 1
          fi
          echo "✓ 兩份實作結論一致"

      - name: 上傳測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-report
          path: bestpartner-service/build/reports/tests/
          if-no-files-found: ignore

  frontend:
    name: 前端型別檢查 + 單元測試
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bestpartner-ui/package-lock.json

      - name: 安裝相依（乾淨還原）
        working-directory: bestpartner-ui
        run: npm ci

      - name: 機械化強制 — 型別檢查 + 建置（vue-tsc）
        working-directory: bestpartner-ui
        run: npm run build

      - name: 單元測試（vitest）
        working-directory: bestpartner-ui
        run: npm run test
