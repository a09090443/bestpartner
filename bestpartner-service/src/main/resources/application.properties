quarkus.http.port=80

# log 設定 - 控制台
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# log level - 依環境不同
%dev.quarkus.log.level=DEBUG
%sit.quarkus.log.level=DEBUG
%prod.quarkus.log.level=INFO

# 一般日誌檔案設定
quarkus.log.file.enable=true
quarkus.log.file.path=D:/tmp/bestpartner/bestpartner.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.level=DEBUG
%sit.quarkus.log.file.level=DEBUG
%prod.quarkus.log.file.level=INFO
# 一般日誌輪替設定
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd-HH-mm
quarkus.log.file.rotation.rotate-at-startup=true

# 錯誤日誌檔案設定
quarkus.log.handler.file."ERROR_LOG".enable=true
quarkus.log.handler.file."ERROR_LOG".path=D:/tmp/bestpartner/bestpartner_error.log
quarkus.log.handler.file."ERROR_LOG".level=ERROR
quarkus.log.handler.file."ERROR_LOG".format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
# 錯誤日誌輪替設定
quarkus.log.handler.file."ERROR_LOG".rotation.max-file-size=10M
quarkus.log.handler.file."ERROR_LOG".rotation.max-backup-index=5
quarkus.log.handler.file."ERROR_LOG".rotation.rotate-on-boot=true
quarkus.log.handler.file."ERROR_LOG".rotation.file-suffix=.yyyy-MM-dd-HH-mm
quarkus.log.handler.file."ERROR_LOG".rotation.rotate-at-startup=true
# 添加錯誤日誌處理器到根記錄器
quarkus.log.handlers=ERROR_LOG

# database 設定
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=pguser
quarkus.datasource.password=pgpass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pgdb?currentSchema=bestpartner
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=15

# hibernate 設定
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.database.default-schema=bestpartner
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.validate-in-dev-mode=false

# flyway - 僅 sit / prod
%sit.quarkus.flyway.migrate-at-start=false
%sit.quarkus.flyway.create-schemas=true
%sit.quarkus.flyway.baseline-on-migrate=true
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.create-schemas=true
%prod.quarkus.flyway.baseline-on-migrate=true

# jwt 設定
quarkus.http.auth.proactive=false
mp.jwt.verify.issuer=bast-partner
mp.jwt.verify.publickey.location=publicKey.pem
quarkus.native.resources.includes=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# jwt log - 依環境不同
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=DEBUG
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=DEBUG
%dev.quarkus.log.category."io.quarkus.security".level=DEBUG
%dev.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%sit.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=DEBUG
%sit.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=DEBUG
%sit.quarkus.log.category."io.quarkus.security".level=DEBUG
%sit.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%prod.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=INFO
%prod.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=INFO
%prod.quarkus.log.category."io.quarkus.security".level=INFO
%prod.quarkus.log.category."io.smallrye.jwt".level=INFO

# jwt 更新開關
jwt.refresh.switch=true

# 加解密金鑰（用於敏感欄位 AES-GCM 加密，請在正式環境替換為高強度隨機字串）
crypto.secret-key=changeme-please-replace-in-production

# OpenAPI / Swagger 設定
quarkus.smallrye-openapi.info-title=BestPartner API
quarkus.smallrye-openapi.info-version=0.1.7
quarkus.smallrye-openapi.info-description=BestPartner AI 應用平台 API
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.auto-add-security=true
quarkus.smallrye-openapi.auto-add-security-requirement=true

# Swagger UI - 只在 dev / sit 開放
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
%sit.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/swagger-ui
%sit.quarkus.swagger-ui.path=/swagger-ui

# dev 限定設定
%dev.mcp.server.log.enable=true
%dev.file.upload.dir=D:/tmp/bestpartner/upload

# sit 限定設定
%sit.mcp.server.log.enable=true
