# =============================================================================
# 環境設定原則
# -----------------------------------------------------------------------------
# 1. 所有「跨環境會變動」的值一律寫成 ${ENV_VAR:預設值}，預設值＝本機 Windows 開發值，
#    讓 `./gradlew quarkusDev` 不帶任何 env 也能直接跑。
# 2. 其他環境（sit / uat / prod / docker）以 .env.<profile> 覆寫，
#    容器則用 `docker run -e QUARKUS_PROFILE=<profile> --env-file .env.<profile>`。
# 3. profile 只負責「行為差異」（log 等級、swagger 開關），
#    連線位址與機密一律走環境變數，不寫死在此檔。
# 詳見 .claude/rules/configuration-and-profiles.md
# =============================================================================

quarkus.http.port=${HTTP_PORT:80}

# log 設定 - 控制台
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# log level - 依環境不同
%dev.quarkus.log.level=DEBUG
%docker.quarkus.log.level=DEBUG
%sit.quarkus.log.level=DEBUG
%uat.quarkus.log.level=INFO
%prod.quarkus.log.level=INFO

# 一般日誌檔案設定
# LOG_DIR 預設為 Windows 開發路徑；容器/Linux 環境務必以環境變數覆寫為 POSIX 路徑
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:D:/tmp/bestpartner}/bestpartner.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.level=DEBUG
%docker.quarkus.log.file.level=DEBUG
%sit.quarkus.log.file.level=DEBUG
%uat.quarkus.log.file.level=INFO
%prod.quarkus.log.file.level=INFO
# 一般日誌輪替設定
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd-HH-mm

# 錯誤日誌檔案設定
quarkus.log.handler.file."ERROR_LOG".enable=true
quarkus.log.handler.file."ERROR_LOG".path=${LOG_DIR:D:/tmp/bestpartner}/bestpartner_error.log
quarkus.log.handler.file."ERROR_LOG".level=ERROR
quarkus.log.handler.file."ERROR_LOG".format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
# 錯誤日誌輪替設定
quarkus.log.handler.file."ERROR_LOG".rotation.max-file-size=10M
quarkus.log.handler.file."ERROR_LOG".rotation.max-backup-index=5
quarkus.log.handler.file."ERROR_LOG".rotation.rotate-on-boot=true
quarkus.log.handler.file."ERROR_LOG".rotation.file-suffix=.yyyy-MM-dd-HH-mm
# 添加錯誤日誌處理器到根記錄器
quarkus.log.handlers=ERROR_LOG

# database 設定
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:pguser}
quarkus.datasource.password=${DB_PASSWORD:pgpass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/pgdb?currentSchema=bestpartner}
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN:5}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:15}

# hibernate 設定
# ⚠️ log.sql 與 log.bind-parameters 是 build-time 設定（已實測：runtime 覆寫無效），
#    在「單一 image 跑多環境」下不可用 %profile 前綴控制——那會被建置時的 prod 求值成 false，
#    連 dev/sit 都拿不到 SQL 日誌。故此處一律開啟「產生日誌的能力」，
#    實際是否輸出改由下方 runtime 的 log 類別等級把關（同 swagger-ui 的 always-include/enable 模式）。
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.database.default-schema=bestpartner
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.validate-in-dev-mode=false

# Hibernate SQL 日誌 - 只有 dev / docker / sit 實際輸出（runtime，可切換）
# 全域 OFF 是安全預設：即使有人在 uat/prod 為了排查把 quarkus.log.level 調成 DEBUG，
# SQL 與繫結參數（可能含個資或加密欄位內容）仍不會寫進日誌。
quarkus.log.category."org.hibernate.SQL".level=OFF
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=OFF
%dev.quarkus.log.category."org.hibernate.SQL".level=DEBUG
%dev.quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
%docker.quarkus.log.category."org.hibernate.SQL".level=DEBUG
%docker.quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
%sit.quarkus.log.category."org.hibernate.SQL".level=DEBUG
%sit.quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE

# jwt 設定
quarkus.http.auth.proactive=false
mp.jwt.verify.issuer=bast-partner
mp.jwt.verify.publickey.location=publicKey.pem
quarkus.native.resources.includes=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# jwt log - 依環境不同
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=DEBUG
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=DEBUG
%dev.quarkus.log.category."io.quarkus.security".level=DEBUG
%dev.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%docker.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=DEBUG
%docker.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=DEBUG
%docker.quarkus.log.category."io.quarkus.security".level=DEBUG
%docker.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%sit.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=DEBUG
%sit.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=DEBUG
%sit.quarkus.log.category."io.quarkus.security".level=DEBUG
%sit.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%uat.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=INFO
%uat.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=INFO
%uat.quarkus.log.category."io.quarkus.security".level=INFO
%uat.quarkus.log.category."io.smallrye.jwt".level=INFO
%prod.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=INFO
%prod.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=INFO
%prod.quarkus.log.category."io.quarkus.security".level=INFO
%prod.quarkus.log.category."io.smallrye.jwt".level=INFO

# jwt 更新開關
jwt.refresh.switch=${JWT_REFRESH_SWITCH:true}

# 加解密金鑰（用於「資料庫敏感欄位」AES-GCM 加密，如 llm_setting.api_key）
# 預設值僅供本機開發；sit 以上環境務必以 CRYPTO_SECRET_KEY 覆寫為高強度隨機字串
crypto.secret-key=${CRYPTO_SECRET_KEY:changeme-please-replace-in-production}

# 設定檔機密值加密的根金鑰（用於「設定值」解密，與上方資料金鑰刻意分離）
#
# 用法：.env.<profile> 中的機密值寫成密文 expression，啟動時由 SmallRye 自動解密：
#   DB_PASSWORD=${enc::<密文>}
# 密文以 `./gradlew encryptConfigSecret` 產生（見 build.gradle.kts）。
#
# 註：`enc` 是本專案的短名 handler（EncSecretKeysHandlerFactory），
#     等價於 SmallRye 內建的 `aes-gcm-nopadding`，密文格式相同、兩種前綴都可解。
#     下方設定鍵沿用內建 handler 的名稱（父類別硬編碼，無法改），與短名不一致屬預期。
#
# ⚠️ 此根金鑰本身無法被加密（bootstrap secret），只能靠環境隔離保護，
#    務必以 CONFIG_ENCRYPTION_KEY 環境變數提供，且與 CRYPTO_SECRET_KEY 不同值。
#    兩者分離的用意：換掉其中一把不會波及另一邊的既有密文。
#
# 預設值僅為讓本機開發免設定即可啟動——本檔中的機密預設值（pgpass 等）
# 一律是「非機密的本機開發值」而非真實機密，故不加密；真實機密只存在於
# .env.<profile>，那裡才寫密文。handler 為 lazy 初始化，未使用密文時不會被觸發。
smallrye.config.secret-handler.aes-gcm-nopadding.encryption-key=${CONFIG_ENCRYPTION_KEY:dev-only-config-key-not-a-real-secret}

# 檔案上傳目錄（LLMService / SkillService 以 @ConfigProperty 注入，所有 profile 都必須有值）
file.upload.dir=${FILE_UPLOAD_DIR:D:/tmp/bestpartner/upload}

# OpenAPI / Swagger 設定
quarkus.smallrye-openapi.info-title=BestPartner API
quarkus.smallrye-openapi.info-version=0.1.7
quarkus.smallrye-openapi.info-description=BestPartner AI 應用平台 API
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.auto-add-security=true
quarkus.smallrye-openapi.auto-add-security-requirement=true

# OpenAPI spec（/q/openapi）與 Swagger UI 同步管制：僅 dev / docker / sit 對外。
# enable 為 runtime 設定，與 swagger-ui.enable 採同一套安全預設（未指定 profile 即關閉）。
quarkus.smallrye-openapi.enable=false
%dev.quarkus.smallrye-openapi.enable=true
%docker.quarkus.smallrye-openapi.enable=true
%sit.quarkus.smallrye-openapi.enable=true

# Swagger UI - 只在 dev / docker / sit 對外開放（uat / prod 關閉）
#
# ⚠️ 這兩個設定的性質不同，是「單一 image 跑多環境」能成立的關鍵（已實測）：
#   - always-include：build-time，由「建置當下」的 profile 決定，runtime 改不動。
#     故設為全域 true，讓 Swagger UI 一律打包進 image。
#   - enable：runtime，可由 profile 或 QUARKUS_SWAGGER_UI_ENABLE 環境變數切換。
#     實際是否對外由它決定。
#
# 全域預設 false 是刻意的「安全預設」：萬一部署時忘了帶 QUARKUS_PROFILE，
# 落點是「關閉」而非「開放」。dev / docker / sit 才明確打開。
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.enable=false
%dev.quarkus.swagger-ui.enable=true
%docker.quarkus.swagger-ui.enable=true
%sit.quarkus.swagger-ui.enable=true

# MCP server 日誌開關（McpServerService 已帶 defaultValue=false）
%dev.mcp.server.log.enable=true
%docker.mcp.server.log.enable=true
%sit.mcp.server.log.enable=true

# OpenRouter 系統預設模型設定（ADMIN CHAT 使用）
# api-key 留空時 AIPlatformOpenrouterConfig 仍會建立設定，但呼叫 OpenRouter 會回 401；
# 各環境於 .env.<profile> 提供 OPENROUTER_API_KEY 即可啟用
ai-platform.openrouter.api-key=${OPENROUTER_API_KEY:}
ai-platform.openrouter.model-name=${OPENROUTER_MODEL:openai/gpt-5.5-pro}
ai-platform.openrouter.temperature=${OPENROUTER_TEMPERATURE:0.7}
ai-platform.openrouter.top-p=${OPENROUTER_TOP_P:0.5}
ai-platform.openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:4096}
ai-platform.openrouter.timeout=${OPENROUTER_TIMEOUT:60s}
# 請求/回應全文記錄僅開發環境開啟，避免 uat / prod 將 prompt 內容寫入日誌
%dev.ai-platform.openrouter.log-requests=true
%dev.ai-platform.openrouter.log-responses=true
%docker.ai-platform.openrouter.log-requests=true
%docker.ai-platform.openrouter.log-responses=true
%sit.ai-platform.openrouter.log-requests=true
%sit.ai-platform.openrouter.log-responses=true
