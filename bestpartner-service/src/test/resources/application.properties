# 測試專用設定（test profile）
# 僅補上正式 application.properties 中只在 %dev 定義、預設 test profile 缺少的必要鍵，
# 屬「加法」補預設值，不覆寫/刪除既有 production 或 %dev 設定。

# LLMService / SkillService 以 @ConfigProperty 注入，無預設值；
# 正式檔僅定義 %dev.file.upload.dir，故 test profile 需補上預設值才能啟動。
file.upload.dir=${java.io.tmpdir}/bestpartner-test-upload
