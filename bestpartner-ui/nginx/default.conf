# 前端容器 nginx：提供 SPA 靜態檔，並把後端 API / 頁面代理到 compose 服務名 backend。
# 代理範圍對齊 vite.config.ts 的開發代理，另加 /view/、/systemSetting/（存活探測 /view/chat 經前端 80 埠可達）。

# 存取日誌只記錄必要欄位：不記 Authorization 標頭、cookie、query string 與 request body
log_format bp_safe '$remote_addr [$time_local] "$request_method $uri" '
                   '$status $body_bytes_sent $request_time';

upstream bestpartner_backend {
    server backend:80;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log bp_safe;

    root /usr/share/nginx/html;
    index index.html;

    # 後端未設定 quarkus.http.limits.max-body-size，Quarkus 預設上限 10M；
    # nginx 取 12m 留餘裕，避免 /llm/uploadFile、/llm/skill/upload、/llm/vector/uploadFiles 先被 413 擋下
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 全部 /llm 系列 API，含 SSE 串流（/llm/workflow/execute、/llm/chatStreaming、/llm/customAssistantChatStreaming）
    location /llm/ {
        proxy_pass http://bestpartner_backend;
        proxy_http_version 1.1;
        # location 內一旦宣告 proxy_set_header，就不再繼承 server 層的設定，故此處完整列出
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 裸 /login 是 SPA 前端路由，必須精確匹配交給 index.html：
    # 若只有下方帶尾斜線且含 proxy_pass 的 /login/，nginx 會把裸 /login 自動 301 轉址到 /login/（進後端代理）
    location = /login {
        try_files /index.html =404;
    }

    # 只代理登入 API（POST /login/ 及其子路徑）
    location /login/ {
        proxy_pass http://bestpartner_backend;
    }

    location /view/ {
        proxy_pass http://bestpartner_backend;
    }

    location /systemSetting/ {
        proxy_pass http://bestpartner_backend;
    }

    # SPA history 模式：/login、/editor/:id 等深層連結重新整理不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
